[project]
name = "permit-review"
version = "0.1.0"
description = "PermitReady PDF image rendering, file checks and visual boolean decisions."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "python-multipart>=0.0.33",
    "pymupdf>=2.1",
]

[project.scripts]
permit-review = "permit_review.main:run"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
