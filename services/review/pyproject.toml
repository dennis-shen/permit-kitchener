[project]
name = "permit-review"
version = "0.1.0"
description = "PermitReady document review service: file checks now, the custom review API later."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
permit-review = "permit_review.main:run"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
