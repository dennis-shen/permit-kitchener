[project]
name = "permit-vision"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.8",
  "pymupdf>=1.24",
  "opencv-python-headless>=4.10",
  "numpy>=1.26",
  "rapidfuzz>=3.9",
  "pytesseract>=0.3.10",
]

[project.optional-dependencies]
paddle = ["paddleocr>=2.8", "paddlepaddle>=2.6"]
vlm = ["anthropic>=0.40"]
dev = ["pytest>=8", "httpx>=0.27", "pikepdf>=9", "python-docx>=1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
