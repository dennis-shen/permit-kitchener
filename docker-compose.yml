# First run builds the vision image and the web app (a few minutes). After that, `docker compose up`
# starts in seconds: the reviewer reloads on save, and the web app rebuilds on start only if its code
# or data changed. Add --build only after changing services/vision/pyproject.toml.
services:
  vision:
    build: { context: ., dockerfile: services/vision/Dockerfile }
    image: permit-vision
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes: ["./services/vision/app:/srv/app", "./data:/data"]
    ports: ["8000:8000"]
    environment:
      VLM_PROVIDER: ${VLM_PROVIDER:-none}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  web:
    image: node:20
    working_dir: /app
    volumes: [".:/app", "web_node_modules:/app/node_modules", "pnpm_store:/root/.local/share/pnpm"]
    # Production server (fast pages); see scripts/docker-web.sh
    command: sh scripts/docker-web.sh
    ports: ["3000:3000"]
    environment:
      VISION_URL: http://vision:8000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CI: "true"
    depends_on: [vision]
volumes:
  web_node_modules:
  pnpm_store:
