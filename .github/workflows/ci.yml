name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @permit/web build

  vision:
    runs-on: ubuntu-latest
    env: { VLM_PROVIDER: none, OCR_ENGINE: tesseract }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr qpdf
      - run: pip install -e "services/vision[dev]"
      - run: pytest
        working-directory: services/vision

  # Enabled in Phase 2 by Codex-C once tests/e2e exists.
  e2e:
    if: ${{ hashFiles('tests/e2e/**/*.spec.ts') != '' }}
    needs: [node, vision]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build vision
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --trace off
        env: { VISION_URL: http://localhost:8000 }
