name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test # unit + golden scenarios + policy
      - run: pnpm --filter @permit/web build

  vision:
    runs-on: ubuntu-latest
    env: { VLM_PROVIDER: none }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m venv services/vision/.venv && services/vision/.venv/bin/pip install -e "services/vision[dev]"
      - run: .venv/bin/pytest -q
        working-directory: services/vision

  e2e:
    needs: [node, vision]
    runs-on: ubuntu-latest
    env: { VLM_PROVIDER: none }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m venv services/vision/.venv && services/vision/.venv/bin/pip install -e "services/vision[dev]"
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @permit/web build
      - run: pnpm test:e2e
